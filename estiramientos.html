<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meraki App — Estiramientos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .zona-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--blanco);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: var(--sombra);
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--negro);
    }
    .zona-item .nombre-zona {
      font-weight: 700;
      font-size: 15px;
    }
    .zona-item .miniatura {
      width: 52px; height: 52px; border-radius: 10px; object-fit: cover;
      flex-shrink: 0; background: var(--beige);
    }
    .zona-item .info-zona {
      display: flex; align-items: center; gap: 12px; min-width: 0;
    }
  </style>
</head>
<body>
  <div class="pantalla">
    <div class="barra-superior">
      <button class="boton-atras" onclick="window.location.href='inicio.html'" aria-label="Atrás">&#8592;</button>
      <span class="titulo-barra">Estiramientos rápidos</span>
    </div>

    <div class="contenido">
      <p class="texto-suave">Estiramientos cortos para complementar tu automasaje.</p>
      <div id="lista-estiramientos"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script src="js/estiramientos.js"></script>
  <script>
    (async function iniciar() {
    const usuarioEstiramientos = await requiereSesion();

    if (usuarioEstiramientos) {
      const tieneAcceso = (item) =>
        !item.premium ||
        usuarioEstiramientos.rol === 'admin' ||
        usuarioEstiramientos.estado_suscripcion === 'activo';

      const contenedor = document.getElementById('lista-estiramientos');
      let html = '';
      for (const item of ESTIRAMIENTOS) {
        const etiqueta = item.premium
          ? '<span class="etiqueta etiqueta-premium">Premium</span>'
          : '<span class="etiqueta etiqueta-gratis">Gratis</span>';
        html += `
          <a href="estiramiento.html?id=${item.id}" class="zona-item">
            <span class="info-zona">
              <img src="${item.imagen}" alt="" class="miniatura" />
              <span class="nombre-zona">${item.nombre}</span>
            </span>
            ${etiqueta}
          </a>`;
      }
      contenedor.innerHTML = html;
    }
    })();
  </script>
</body>
</html>

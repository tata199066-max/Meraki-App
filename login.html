<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />
  <link rel="apple-touch-icon" href="images/icono-apple-touch.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f0e5cf" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Meraki App" />
  <meta property="og:title" content="Meraki App — Estética &amp; Bienestar" />
  <meta property="og:description" content="Guía de bienestar con técnicas reales de automasaje para aliviar la tensión muscular del día a día." />
  <meta property="og:image" content="https://meraki-app1.netlify.app/images/og-portada.png" />
  <title>Meraki App — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="js/meta-pixel.js"></script>
</head>
<body>
  <div class="pantalla">
    <div class="barra-superior">
      <button class="boton-atras" onclick="window.location.href='index.html'" aria-label="Atrás">&#8592;</button>
    </div>

    <div class="contenido">
      <h1 id="titulo-form" class="centrado">Crear mi cuenta</h1>
      <p class="centrado texto-suave" id="subtitulo-form">Regístrate con tu correo para empezar.</p>

      <form id="form-auth" novalidate>
        <div class="campo" id="campo-nombre">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="¿Cómo te llamas?" />
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required />
        </div>

        <div class="campo" id="campo-celular">
          <label for="celular">Celular (opcional)</label>
          <input type="tel" id="celular" name="celular" placeholder="Para avisarte por WhatsApp (opcional)" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
        </div>

        <div id="mensaje-error" class="mensaje-error" style="display:none;"></div>
        <div id="mensaje-exito" class="mensaje-aviso" style="display:none;"></div>

        <button type="submit" class="boton boton-primario" id="boton-enviar">Crear mi cuenta</button>
      </form>

      <p class="centrado texto-suave" style="margin-top:14px; display:none;" id="parrafo-olvide">
        <a href="#" id="link-olvide" style="font-weight:700; text-decoration:underline;">¿Olvidaste tu contraseña?</a>
      </p>

      <p class="centrado texto-suave" style="margin-top:20px;">
        <span id="texto-cambio">¿Ya tienes cuenta?</span>
        <a href="#" id="link-cambio" style="font-weight:700; text-decoration:underline;">Inicia sesión</a>
      </p>

      <p class="centrado texto-suave" id="parrafo-terminos" style="margin-top:14px; font-size:12px;">
        Al crear tu cuenta aceptas nuestros
        <a href="terminos.html" style="font-weight:700; text-decoration:underline;">Términos y Privacidad</a>.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let modo = params.get('modo') === 'login' ? 'login' : 'registro';

    const tituloForm = document.getElementById('titulo-form');
    const subtituloForm = document.getElementById('subtitulo-form');
    const campoNombre = document.getElementById('campo-nombre');
    const campoCelular = document.getElementById('campo-celular');
    const campoPassword = document.getElementById('password').closest('.campo');
    const botonEnviar = document.getElementById('boton-enviar');
    const textoCambio = document.getElementById('texto-cambio');
    const linkCambio = document.getElementById('link-cambio');
    const parrafoOlvide = document.getElementById('parrafo-olvide');
    const linkOlvide = document.getElementById('link-olvide');
    const mensajeError = document.getElementById('mensaje-error');
    const mensajeExito = document.getElementById('mensaje-exito');
    const parrafoTerminos = document.getElementById('parrafo-terminos');

    function actualizarVista() {
      mensajeError.style.display = 'none';
      mensajeExito.style.display = 'none';

      if (modo === 'olvide') {
        tituloForm.textContent = 'Recuperar contraseña';
        subtituloForm.textContent = 'Escribe tu correo y te enviamos un link para poner una contraseña nueva.';
        campoNombre.style.display = 'none';
        campoCelular.style.display = 'none';
        campoPassword.style.display = 'none';
        botonEnviar.textContent = 'Enviar link de recuperación';
        parrafoOlvide.style.display = 'none';
        parrafoTerminos.style.display = 'none';
        textoCambio.textContent = '¿Ya la recordaste?';
        linkCambio.textContent = 'Inicia sesión';
      } else if (modo === 'registro') {
        tituloForm.textContent = 'Crear mi cuenta';
        subtituloForm.textContent = 'Regístrate con tu correo para empezar.';
        campoNombre.style.display = 'block';
        campoCelular.style.display = 'block';
        campoPassword.style.display = 'block';
        botonEnviar.textContent = 'Crear mi cuenta';
        parrafoOlvide.style.display = 'none';
        parrafoTerminos.style.display = 'block';
        textoCambio.textContent = '¿Ya tienes cuenta?';
        linkCambio.textContent = 'Inicia sesión';
      } else {
        tituloForm.textContent = 'Iniciar sesión';
        subtituloForm.textContent = 'Ingresa con tu correo y contraseña.';
        campoNombre.style.display = 'none';
        campoCelular.style.display = 'none';
        campoPassword.style.display = 'block';
        botonEnviar.textContent = 'Iniciar sesión';
        parrafoOlvide.style.display = 'block';
        parrafoTerminos.style.display = 'none';
        textoCambio.textContent = '¿No tienes cuenta?';
        linkCambio.textContent = 'Regístrate';
      }
    }

    linkCambio.addEventListener('click', (e) => {
      e.preventDefault();
      modo = modo === 'registro' ? 'login' : 'registro';
      actualizarVista();
    });

    linkOlvide.addEventListener('click', (e) => {
      e.preventDefault();
      modo = 'olvide';
      actualizarVista();
    });

    document.getElementById('form-auth').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const email = document.getElementById('email').value.trim();
      const celular = document.getElementById('celular').value.trim();
      const password = document.getElementById('password').value;

      mensajeError.style.display = 'none';
      mensajeExito.style.display = 'none';

      if (!email || (modo !== 'olvide' && !password)) {
        mensajeError.textContent = 'Por favor completa correo y contraseña.';
        mensajeError.style.display = 'block';
        return;
      }

      botonEnviar.disabled = true;
      botonEnviar.textContent = 'Un momento...';

      if (modo === 'olvide') {
        const resultado = await solicitarRecuperacionContrasena(email);
        botonEnviar.disabled = false;
        if (resultado.error) {
          mensajeError.textContent = resultado.error;
          mensajeError.style.display = 'block';
          actualizarVista();
          mensajeError.style.display = 'block';
          return;
        }
        mensajeExito.textContent = 'Listo, revisa tu correo (y la carpeta de spam) — te llegó un link para poner una contraseña nueva.';
        mensajeExito.style.display = 'block';
        botonEnviar.textContent = 'Enviar link de recuperación';
        return;
      }

      let resultado;
      if (modo === 'registro') {
        resultado = await registrarUsuario({ nombre, email, password, celular });
      } else {
        resultado = await iniciarSesion({ email, password });
      }

      if (modo === 'registro' && !resultado.error && typeof fbq === 'function') {
        fbq('track', 'CompleteRegistration');
      }

      if (resultado.requiereConfirmacion) {
        mensajeExito.textContent = 'Listo, revisa tu correo (y la carpeta de spam) — te llegó un link para confirmar tu cuenta. Ábrelo y luego inicia sesión aquí.';
        mensajeExito.style.display = 'block';
        botonEnviar.disabled = false;
        botonEnviar.textContent = 'Crear mi cuenta';
        return;
      }

      if (resultado.error) {
        mensajeError.textContent = resultado.error;
        mensajeError.style.display = 'block';
        botonEnviar.disabled = false;
        actualizarVista();
        mensajeError.style.display = 'block';
        return;
      }

      const respuestasQuiz = await obtenerRespuestasQuiz(resultado.usuario.id);
      if (respuestasQuiz) {
        window.location.href = 'inicio.html';
      } else {
        window.location.href = 'quiz.html';
      }
    });

    actualizarVista();
  </script>
</body>
</html>
